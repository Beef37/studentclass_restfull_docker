name: CI pipeline
on:
  push:
    branches: [ "main" ]
env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: checkout repository
      uses: actions/checkout@v4
    - name: log in to the container registry
      uses: docker/login-action@v4
      with:
        registry: ${{env.REGISTRY}}
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
    - name: convert repository owner to lowercase
      run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
    - name: build and push database image
      uses: docker/build-push-action@v5
      with:
        context: ./database
        push: true
        tags: ${{env.REGISTRY}}/${{env.REPO_OWNER}}/studentclass-database:latest
    - name: build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{env.REGISTRY}}/${{env.REPO_OWNER}}/studentclass-backend:latest
    - name: build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{env.REGISTRY}}/${{env.REPO_OWNER}}/studentclass-frontend:latest
